title = "Qubicl secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and ignored build, dependency, and candidate output"
paths = [
  '''(^|/)(node_modules|dist-tests|release)(/|$)''',
  '''(^|/)packages/[^/]+/dist(/|$)''',
  '''(^|/)qubicl-[^/]+\.tgz$''',
  '''(^|/)qubicl-npm\.spdx\.json$'''
]

[[allowlists]]
description = "RFC 6455 sample WebSocket nonce used by the gateway integration test"
condition = "AND"
paths = ['''(^|/)tests/integration/gateway\.test\.ts$''']
regexTarget = "line"
regexes = ['''Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = "Public self-signed TLS keys used only by the remote-gateway test fixture"
condition = "AND"
rules = ["private-key"]
paths = ['''(^|/)tests/unit/gateway-test-fixtures\.ts$''']
